<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients - Recipe Management App</title>
    <link rel="stylesheet" href="ingredient-page.css">
</head>
<body>

    <!-- Link back to the recipe page. It is plain HTML navigation: no JS needed.
         ../ = go up one folder (out of /ingredients), then into /recipe -->
    <a id="back-link" href="../recipe/recipe-page.html">&larr; Back to Recipes</a>

    <!-- Page heading -->
    <h1>Ingredient Management</h1>

    <!-- List of ingredients: the <ul> starts EMPTY, JS fills it with <li> items -->
    <section>
        <h2>Ingredients</h2>
        <ul id="ingredient-list"></ul>
    </section>

    <!-- Add an ingredient -->
    <section>
        <h2>Add an Ingredient</h2>
        <input type="text" id="add-ingredient-name-input" placeholder="Ingredient name">
        <button type="button" id="add-ingredient-submit-button">Add Ingredient</button>
    </section>

    <!-- Delete an ingredient -->
    <section>
        <h2>Delete an Ingredient</h2>
        <input type="text" id="delete-ingredient-name-input" placeholder="Ingredient name">
        <button type="button" id="delete-ingredient-submit-button">Delete Ingredient</button>
    </section>

    <!-- Script is last so every element above already exists when JS looks them up -->
    <script src="ingredient-page.js"></script>
</body>
</html>
